<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTC // Cycle Terminal</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
  // Respaldo: si jsdelivr falla por algún motivo, se intenta con unpkg como plan B.
  window.addEventListener('error', function loadFallback(e){
    if(typeof LightweightCharts === 'undefined'){
      var s = document.createElement('script');
      s.src = 'https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js';
      s.onload = function(){ if(window.__initChart) window.__initChart(); };
      document.head.appendChild(s);
      window.removeEventListener('error', loadFallback);
    }
  }, true);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070a10;
    --panel:#0e141d;
    --panel-2:#111a25;
    --border:#1c2733;
    --cyan:#00e5ff;
    --magenta:#ff2e88;
    --green:#39ff88;
    --amber:#ffb020;
    --text:#dce8f2;
    --muted:#5f7387;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;background:var(--bg);
    color:var(--text);
    font-family:'JetBrains Mono',monospace;
    overflow:hidden;
  }
  .app{
    display:grid;
    grid-template-columns: 1fr 340px;
    grid-template-rows: 56px 1fr;
    height:100vh;
    width:100vw;
  }
  header{
    grid-column: 1 / 3;
    display:flex;align-items:center;gap:18px;
    padding:0 18px;
    background:linear-gradient(180deg,#0c121a,#0a0f16);
    border-bottom:1px solid var(--border);
  }
  header h1{
    font-family:'Orbitron',sans-serif;
    font-size:15px;font-weight:800;letter-spacing:2px;
    color:var(--cyan);
    text-shadow:0 0 12px rgba(0,229,255,.5);
    margin:0;white-space:nowrap;
  }
  header h1 span{color:var(--muted);font-weight:600;font-size:11px;letter-spacing:1px;}
  .controls{display:flex;gap:10px;align-items:center;flex:1;flex-wrap:wrap;}
  select, input[type=text], input[type=number]{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    padding:7px 9px;
    border-radius:4px;
    outline:none;
  }
  select:focus, input:focus{border-color:var(--cyan);}
  .price-tag{
    margin-left:auto;
    display:flex;align-items:center;gap:10px;
    font-family:'Orbitron',sans-serif;
  }
  .price-tag .val{font-size:20px;font-weight:800;transition:color .2s;}
  .up{color:var(--green);text-shadow:0 0 10px rgba(57,255,136,.5);}
  .down{color:var(--magenta);text-shadow:0 0 10px rgba(255,46,136,.5);}
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);}
  .status-dot.live{background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.6s infinite;}
  .status-dot.err{background:var(--magenta);box-shadow:0 0 8px var(--magenta);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  #chart-wrap{position:relative;border-right:1px solid var(--border);}
  #chart{width:100%;height:100%;}

  aside{
    background:var(--panel);
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  .side-section{
    padding:14px 16px;
    border-bottom:1px solid var(--border);
  }
  .side-section h2{
    font-family:'Orbitron',sans-serif;
    font-size:11px;letter-spacing:2px;color:var(--muted);
    margin:0 0 10px 0;text-transform:uppercase;
  }
  .alarm-form{display:flex;flex-direction:column;gap:8px;}
  .alarm-form .row{display:flex;gap:8px;}
  .alarm-form select, .alarm-form input{flex:1;width:100%;}
  button{
    background:var(--panel-2);
    border:1px solid var(--cyan);
    color:var(--cyan);
    font-family:'JetBrains Mono',monospace;
    font-size:12px;font-weight:700;
    padding:8px 10px;border-radius:4px;
    cursor:pointer;transition:.15s;
  }
  button:hover{background:var(--cyan);color:#031014;}
  button.secondary{border-color:var(--border);color:var(--muted);}
  button.secondary:hover{background:var(--panel-2);color:var(--text);border-color:var(--muted);}
  button.danger{border-color:var(--magenta);color:var(--magenta);}
  button.danger:hover{background:var(--magenta);color:#1a0008;}

  #alarm-list, #log-list{
    flex:1;overflow-y:auto;padding:8px 12px;
  }
  .alarm-item{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--panel-2);
    border:1px solid var(--border);
    border-left:3px solid var(--cyan);
    border-radius:4px;
    padding:8px 10px;margin-bottom:8px;
    font-size:12px;
  }
  .alarm-item.below{border-left-color:var(--magenta);}
  .alarm-item.triggered{border-left-color:var(--amber);opacity:.55;}
  .alarm-item .meta{display:flex;flex-direction:column;gap:2px;}
  .alarm-item .meta small{color:var(--muted);font-size:10px;}
  .alarm-item .price{font-weight:700;font-family:'Orbitron',sans-serif;}
  .del-btn{
    background:none;border:none;color:var(--muted);
    font-size:14px;cursor:pointer;padding:2px 6px;
  }
  .del-btn:hover{color:var(--magenta);}

  .log-entry{
    font-size:11px;color:var(--muted);padding:6px 0;
    border-bottom:1px dashed var(--border);
  }
  .log-entry.hit{color:var(--green);}

  .empty{color:var(--muted);font-size:11px;text-align:center;padding:20px 0;}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted);}
  .toggle-row label{display:flex;align-items:center;gap:6px;cursor:pointer;}

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

  #flash-overlay{
    position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(circle at 50% 0%, rgba(255,176,32,.25), transparent 60%);
    opacity:0;transition:opacity .3s;z-index:50;
  }
  #flash-overlay.on{opacity:1;}
</style>
</head>
<body>

<div id="flash-overlay"></div>

<div class="app">
  <header>
    <h1>◆ CYCLE TERMINAL <span>v0.1 // spot data via binance</span></h1>
    <div class="controls">
      <select id="symbolSelect">
        <option value="BTCUSDT">BTC/USDT</option>
        <option value="ETHUSDT">ETH/USDT</option>
        <option value="SOLUSDT">SOL/USDT</option>
        <option value="BNBUSDT">BNB/USDT</option>
        <option value="XRPUSDT">XRP/USDT</option>
      </select>
      <input type="text" id="customSymbol" placeholder="otro par (ej PEPEUSDT)" style="width:150px;">
      <select id="intervalSelect">
        <option value="1m">1m</option>
        <option value="5m" selected>5m</option>
        <option value="15m">15m</option>
        <option value="1h">1h</option>
        <option value="4h">4h</option>
        <option value="1d">1D</option>
      </select>
      <span class="status-dot" id="statusDot" title="estado conexión"></span>
    </div>
    <div class="price-tag">
      <span id="symbolLabel">BTCUSDT</span>
      <span class="val" id="priceVal">--</span>
    </div>
  </header>

  <div id="chart-wrap"><div id="chart"></div></div>

  <aside>
    <div class="side-section">
      <h2>Nueva Alarma</h2>
      <div class="alarm-form">
        <div class="row">
          <select id="alarmDir">
            <option value="above">Cruce ↑ arriba de</option>
            <option value="below">Cruce ↓ abajo de</option>
          </select>
        </div>
        <div class="row">
          <input type="number" id="alarmPrice" placeholder="precio ej. 65000" step="any">
        </div>
        <div class="row">
          <input type="text" id="alarmNote" placeholder="nota (opcional)">
        </div>
        <button id="addAlarmBtn">+ Agregar alarma</button>
        <div class="toggle-row">
          <label><input type="checkbox" id="soundToggle" checked> sonido</label>
          <label><input type="checkbox" id="notifToggle"> notificaciones</label>
        </div>
      </div>
    </div>

    <div class="side-section" style="flex:1;display:flex;flex-direction:column;min-height:0;">
      <h2>Alarmas activas — <span id="symbolLabel2">BTCUSDT</span></h2>
      <div id="alarm-list"></div>
    </div>

    <div class="side-section" style="max-height:180px;display:flex;flex-direction:column;">
      <h2>Historial</h2>
      <div id="log-list"><div class="empty">sin eventos aún</div></div>
    </div>
  </aside>
</div>

<script>
/* =========================================================
   CYCLE TERMINAL — BTC candlestick + alarms, single file
   Datos: Binance public REST + WebSocket (sin API key)
   Extensible: agregar más pares o exchanges más adelante
   ========================================================= */

const state = {
  symbol: 'BTCUSDT',
  interval: '5m',
  ws: null,
  candleSeries: null,
  volSeries: null,
  lastPrice: null,
  alarms: [],       // {id, symbol, price, direction, note, triggered}
  priceLines: {},   // id -> priceLine ref
  audioCtx: null,
};

// ---------- persistence ----------
function loadAlarms(){
  try{
    const raw = localStorage.getItem('cycle_terminal_alarms_v1');
    state.alarms = raw ? JSON.parse(raw) : [];
  }catch(e){
    state.alarms = [];
  }
}
function saveAlarms(){
  try{ localStorage.setItem('cycle_terminal_alarms_v1', JSON.stringify(state.alarms)); }
  catch(e){ /* almacenamiento no disponible, se mantiene solo en memoria */ }
}

// ---------- boot guard ----------
// Si la librería no llegó a cargar todavía (CDN lento o caído),
// esperamos a que el script de respaldo la traiga.
if(typeof LightweightCharts === 'undefined'){
  window.__initChart = initApp;
  window.addEventListener('DOMContentLoaded', function(){
    if(typeof LightweightCharts === 'undefined'){
      setTimeout(function(){
        if(typeof LightweightCharts === 'undefined'){
          document.getElementById('chart').innerHTML =
            '<div style="padding:24px;color:#ff2e88;font-family:JetBrains Mono,monospace;font-size:13px;">No se pudo cargar la librería de gráficos (CDN bloqueado o sin internet). Revisa tu conexión o si tu red bloquea cdn.jsdelivr.net / unpkg.com, y recarga la página.</div>';
        }
      }, 4000);
    }
  });
} else {
  initApp();
}

function initApp(){

// ---------- chart setup ----------
const chartWrap = document.getElementById('chart-wrap');
const chart = LightweightCharts.createChart(document.getElementById('chart'), {
  layout:{
    background:{color:'transparent'},
    textColor:'#5f7387',
    fontFamily:"'JetBrains Mono', monospace",
  },
  grid:{
    vertLines:{color:'#131c27'},
    horzLines:{color:'#131c27'},
  },
  crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
  rightPriceScale:{borderColor:'#1c2733'},
  timeScale:{borderColor:'#1c2733', timeVisible:true, secondsVisible:false},
  autoSize:true,
});

state.candleSeries = chart.addCandlestickSeries({
  upColor:'#39ff88', downColor:'#ff2e88',
  borderUpColor:'#39ff88', borderDownColor:'#ff2e88',
  wickUpColor:'#39ff88', wickDownColor:'#ff2e88',
});

state.volSeries = chart.addHistogramSeries({
  priceFormat:{type:'volume'},
  priceScaleId:'',
  color:'#2a3a4a',
});
state.volSeries.priceScale().applyOptions({
  scaleMargins:{top:0.82, bottom:0},
});
state.candleSeries.priceScale().applyOptions({
  scaleMargins:{top:0.05, bottom:0.22},
});

// ---------- data fetch ----------
async function loadHistory(symbol, interval){
  const url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=500`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('binance http ' + res.status);
  const raw = await res.json();
  const candles = raw.map(k => ({
    time: Math.floor(k[0]/1000),
    open: parseFloat(k[1]), high: parseFloat(k[2]),
    low: parseFloat(k[3]), close: parseFloat(k[4]),
  }));
  const vols = raw.map(k => ({
    time: Math.floor(k[0]/1000),
    value: parseFloat(k[5]),
    color: parseFloat(k[4]) >= parseFloat(k[1]) ? 'rgba(57,255,136,.35)' : 'rgba(255,46,136,.35)',
  }));
  state.candleSeries.setData(candles);
  state.volSeries.setData(vols);
  if(candles.length){
    state.lastPrice = candles[candles.length-1].close;
    updatePriceDisplay(state.lastPrice, null);
  }
}

// ---------- websocket live updates ----------
function connectWS(symbol, interval){
  if(state.ws){
    try{ state.ws.onclose = null; state.ws.close(); }catch(e){}
  }
  setStatus('connecting');
  const wsUrl = `wss://stream.binance.com:9443/ws/${symbol.toLowerCase()}@kline_${interval}`;
  const ws = new WebSocket(wsUrl);
  state.ws = ws;

  ws.onopen = () => setStatus('live');
  ws.onerror = () => setStatus('error');
  ws.onclose = () => {
    setStatus('error');
    // reintento simple con backoff fijo
    setTimeout(() => {
      if(state.symbol === symbol && state.interval === interval){
        connectWS(symbol, interval);
      }
    }, 3000);
  };
  ws.onmessage = (msg) => {
    const data = JSON.parse(msg.data);
    const k = data.k;
    if(!k) return;
    const candle = {
      time: Math.floor(k.t/1000),
      open: parseFloat(k.o), high: parseFloat(k.h),
      low: parseFloat(k.l), close: parseFloat(k.c),
    };
    state.candleSeries.update(candle);
    state.volSeries.update({
      time: candle.time,
      value: parseFloat(k.v),
      color: candle.close >= candle.open ? 'rgba(57,255,136,.35)' : 'rgba(255,46,136,.35)',
    });
    const prev = state.lastPrice;
    state.lastPrice = candle.close;
    updatePriceDisplay(candle.close, prev);
    checkAlarms(candle.close);
  };
}

function setStatus(s){
  const dot = document.getElementById('statusDot');
  dot.classList.remove('live','err');
  if(s === 'live') dot.classList.add('live');
  if(s === 'error') dot.classList.add('err');
}

function updatePriceDisplay(price, prev){
  const el = document.getElementById('priceVal');
  el.textContent = formatPrice(price);
  el.classList.remove('up','down');
  if(prev != null){
    el.classList.add(price >= prev ? 'up' : 'down');
  }
}

function formatPrice(p){
  if(p >= 1000) return p.toLocaleString('en-US',{maximumFractionDigits:2});
  if(p >= 1) return p.toFixed(4);
  return p.toFixed(8);
}

// ---------- alarms ----------
function renderAlarms(){
  const list = document.getElementById('alarm-list');
  const symAlarms = state.alarms.filter(a => a.symbol === state.symbol);
  if(!symAlarms.length){
    list.innerHTML = '<div class="empty">sin alarmas para este par</div>';
  } else {
    list.innerHTML = symAlarms.map(a => `
      <div class="alarm-item ${a.direction} ${a.triggered ? 'triggered' : ''}">
        <div class="meta">
          <span class="price">${a.direction === 'above' ? '↑' : '↓'} ${formatPrice(a.price)}</span>
          <small>${a.note ? a.note : (a.triggered ? 'disparada' : 'activa')}</small>
        </div>
        <button class="del-btn" onclick="removeAlarm('${a.id}')">✕</button>
      </div>
    `).join('');
  }
  syncPriceLines();
}

function syncPriceLines(){
  // limpiar líneas previas
  Object.values(state.priceLines).forEach(line => {
    try{ state.candleSeries.removePriceLine(line); }catch(e){}
  });
  state.priceLines = {};
  state.alarms.filter(a => a.symbol === state.symbol && !a.triggered).forEach(a => {
    const line = state.candleSeries.createPriceLine({
      price: a.price,
      color: a.direction === 'above' ? '#39ff88' : '#ff2e88',
      lineWidth: 1,
      lineStyle: LightweightCharts.LineStyle.Dashed,
      axisLabelVisible: true,
      title: a.note ? a.note : (a.direction === 'above' ? 'alarma ↑' : 'alarma ↓'),
    });
    state.priceLines[a.id] = line;
  });
}

function addAlarm(){
  const priceInput = document.getElementById('alarmPrice');
  const price = parseFloat(priceInput.value);
  if(isNaN(price) || price <= 0){
    priceInput.style.borderColor = '#ff2e88';
    setTimeout(() => priceInput.style.borderColor = '', 800);
    return;
  }
  const direction = document.getElementById('alarmDir').value;
  const note = document.getElementById('alarmNote').value.trim();
  state.alarms.push({
    id: 'a_' + Date.now() + '_' + Math.floor(Math.random()*1000),
    symbol: state.symbol,
    price, direction, note,
    triggered:false,
  });
  saveAlarms();
  renderAlarms();
  priceInput.value = '';
  document.getElementById('alarmNote').value = '';
}

function removeAlarm(id){
  state.alarms = state.alarms.filter(a => a.id !== id);
  saveAlarms();
  renderAlarms();
}
window.removeAlarm = removeAlarm; // para el onclick inline

function checkAlarms(price){
  let changed = false;
  state.alarms.forEach(a => {
    if(a.symbol !== state.symbol || a.triggered) return;
    const hit = (a.direction === 'above' && price >= a.price) ||
                (a.direction === 'below' && price <= a.price);
    if(hit){
      a.triggered = true;
      changed = true;
      fireAlarm(a, price);
    }
  });
  if(changed){
    saveAlarms();
    renderAlarms();
  }
}

function fireAlarm(alarm, price){
  logEvent(alarm, price);
  flashScreen();
  if(document.getElementById('soundToggle').checked) playBeep();
  if(document.getElementById('notifToggle').checked && Notification.permission === 'granted'){
    new Notification('⚠ Alarma ' + alarm.symbol, {
      body: `Precio ${alarm.direction === 'above' ? 'superó' : 'cayó bajo'} ${formatPrice(alarm.price)} (actual: ${formatPrice(price)})${alarm.note ? ' — ' + alarm.note : ''}`,
    });
  }
}

function logEvent(alarm, price){
  const logList = document.getElementById('log-list');
  if(logList.querySelector('.empty')) logList.innerHTML = '';
  const entry = document.createElement('div');
  entry.className = 'log-entry hit';
  const time = new Date().toLocaleTimeString('es-CL');
  entry.textContent = `${time} — ${alarm.symbol} ${alarm.direction === 'above' ? '↑' : '↓'} ${formatPrice(alarm.price)} (actual ${formatPrice(price)})`;
  logList.prepend(entry);
}

function flashScreen(){
  const overlay = document.getElementById('flash-overlay');
  overlay.classList.add('on');
  setTimeout(() => overlay.classList.remove('on'), 500);
}

function playBeep(){
  try{
    if(!state.audioCtx) state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = state.audioCtx;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.5);
    // segundo pulso
    setTimeout(() => {
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.type = 'square';
      osc2.frequency.value = 1100;
      gain2.gain.setValueAtTime(0.15, ctx.currentTime);
      gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      osc2.connect(gain2).connect(ctx.destination);
      osc2.start();
      osc2.stop(ctx.currentTime + 0.4);
    }, 180);
  }catch(e){ /* audio no disponible */ }
}

// ---------- symbol / interval switching ----------
async function switchMarket(){
  const symbol = state.symbol;
  const interval = state.interval;
  document.getElementById('symbolLabel').textContent = symbol;
  document.getElementById('symbolLabel2').textContent = symbol;
  setStatus('connecting');
  try{
    await loadHistory(symbol, interval);
    connectWS(symbol, interval);
    renderAlarms();
  }catch(e){
    setStatus('error');
    console.error(e);
    alert('No se pudo cargar el par "' + symbol + '". Verifica que exista en Binance Spot.');
  }
}

// ---------- UI wiring ----------
document.getElementById('symbolSelect').addEventListener('change', (e) => {
  document.getElementById('customSymbol').value = '';
  state.symbol = e.target.value;
  switchMarket();
});
document.getElementById('customSymbol').addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && e.target.value.trim()){
    state.symbol = e.target.value.trim().toUpperCase();
    switchMarket();
  }
});
document.getElementById('intervalSelect').addEventListener('change', (e) => {
  state.interval = e.target.value;
  switchMarket();
});
document.getElementById('addAlarmBtn').addEventListener('click', addAlarm);
document.getElementById('alarmPrice').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') addAlarm();
});
document.getElementById('notifToggle').addEventListener('change', (e) => {
  if(e.target.checked && Notification.permission !== 'granted'){
    Notification.requestPermission().then(p => {
      if(p !== 'granted') e.target.checked = false;
    });
  }
});

// ---------- init ----------
loadAlarms();
switchMarket();

window.addEventListener('beforeunload', () => {
  if(state.ws) try{ state.ws.close(); }catch(e){}
});

} // fin initApp()
</script>
</body>
</html>
