<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC/USDT 5m – Monitor y Alertas</title>
    <!-- Lightweight Charts -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        /* Reset y base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0f172a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Cabecera */
        #header {
            background: #1e293b;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 10px;
        }
        #header h2 {
            font-size: 20px;
            font-weight: 400;
        }
        #header h2 span {
            font-weight: 300;
            font-size: 14px;
            color: #94a3b8;
        }
        #current-price {
            font-size: 28px;
            font-weight: 600;
            color: #38bdf8;
            min-width: 140px;
            text-align: right;
        }

        /* Contenedor de alerta */
        .alert-container {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #0f172a;
            padding: 6px 16px;
            border-radius: 30px;
        }
        .alert-container label {
            font-size: 14px;
            color: #94a3b8;
        }
        .alert-container input {
            background: #1e293b;
            border: 1px solid #475569;
            color: #f8fafc;
            padding: 6px 12px;
            border-radius: 20px;
            width: 120px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }
        .alert-container input:focus {
            border-color: #38bdf8;
        }
        .alert-container button {
            background: #10b981;
            border: none;
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        .alert-container button:hover {
            background: #059669;
        }
        #status {
            font-size: 13px;
            color: #94a3b8;
            min-width: 100px;
            text-align: center;
        }
        #status.triggered {
            color: #f43f5e;
            font-weight: bold;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Gráfico */
        #chart-container {
            flex: 1;
            position: relative;
            background: #0f172a;
        }

        /* Efecto de alerta visual */
        .alert-flash {
            animation: flashBg 0.8s ease 3;
        }
        @keyframes flashBg {
            0% { background-color: rgba(244, 63, 94, 0.2); }
            50% { background-color: rgba(244, 63, 94, 0.6); }
            100% { background-color: transparent; }
        }

        /* Responsive */
        @media (max-width: 700px) {
            #header {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            #current-price {
                font-size: 22px;
                text-align: center;
            }
            .alert-container {
                justify-content: center;
                flex-wrap: wrap;
            }
            .alert-container input {
                width: 100px;
            }
        }
    </style>
</head>
<body>

    <div id="header">
        <h2>₿ BTC/USDT <span>5m</span></h2>
        <div id="current-price">—</div>
        <div class="alert-container">
            <label for="targetPrice">Alerta en</label>
            <input type="number" id="targetPrice" placeholder="Ej: 98000" step="100">
            <button id="setAlertBtn">Fijar</button>
            <span id="status">● Inactiva</span>
        </div>
    </div>

    <div id="chart-container"></div>

    <script>
        (function() {
            // --- Elementos DOM ---
            const priceEl = document.getElementById('current-price');
            const statusEl = document.getElementById('status');
            const targetInput = document.getElementById('targetPrice');
            const setBtn = document.getElementById('setAlertBtn');

            // --- Estado ---
            let targetPrice = null;      // Precio objetivo
            let alertTriggered = false;  // Para no repetir
            let currentBar = null;       // Vela en formación (5m)
            const TIMEFRAME = 5;         // minutos

            // --- Crear gráfico Lightweight Charts ---
            const container = document.getElementById('chart-container');
            const chart = LightweightCharts.createChart(container, {
                layout: {
                    background: { type: 'solid', color: '#0f172a' },
                    textColor: '#c8d0dc',
                },
                grid: {
                    vertLines: { color: '#1e293b' },
                    horzLines: { color: '#1e293b' },
                },
                timeScale: {
                    timeVisible: true,
                    secondsVisible: false,
                    borderColor: '#334155',
                },
                rightPriceScale: {
                    borderColor: '#334155',
                },
                width: container.clientWidth,
                height: container.clientHeight,
            });

            const candleSeries = chart.addCandlestickSeries({
                upColor: '#26a69a',
                downColor: '#ef5350',
                borderUpColor: '#26a69a',
                borderDownColor: '#ef5350',
                wickUpColor: '#26a69a',
                wickDownColor: '#ef5350',
            });

            // Redimensionar
            const resize = () => {
                const w = container.clientWidth;
                const h = container.clientHeight;
                chart.applyOptions({ width: w, height: h });
            };
            window.addEventListener('resize', resize);
            setTimeout(resize, 100);

            // --- Utilidad: redondear tiempo a 5 minutos ---
            function floorTo5min(seconds) {
                const d = new Date(seconds * 1000);
                const mins = d.getMinutes();
                const remainder = mins % TIMEFRAME;
                d.setMinutes(mins - remainder, 0, 0);
                return Math.floor(d.getTime() / 1000);
            }

            // --- WebSocket a Binance (Aggregated Trades) ---
            const ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@aggTrade');

            ws.onopen = () => {
                console.log('✅ Conectado a Binance');
                priceEl.textContent = 'Conectado...';
            };

            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);
                const price = parseFloat(data.p);
                const tradeTimeMs = data.T; // milisegundos

                // Actualizar precio en header
                priceEl.textContent = '$' + price.toLocaleString('en-US', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });

                // --- Lógica de vela 5m ---
                const eventSeconds = Math.floor(tradeTimeMs / 1000);
                const barTime = floorTo5min(eventSeconds);

                if (currentBar === null || barTime > currentBar.time) {
                    // Nueva vela
                    currentBar = {
                        time: barTime,
                        open: price,
                        high: price,
                        low: price,
                        close: price
                    };
                } else {
                    // Actualizar vela actual
                    currentBar.high = Math.max(currentBar.high, price);
                    currentBar.low = Math.min(currentBar.low, price);
                    currentBar.close = price;
                }

                // Enviar al gráfico
                candleSeries.update(currentBar);

                // --- Verificar alerta ---
                if (targetPrice !== null && !alertTriggered) {
                    // Si el precio alcanza o supera la meta (con un pequeño margen)
                    if (price >= targetPrice - 0.01) {
                        alertTriggered = true;
                        statusEl.textContent = '🚨 ¡ALCANZADA! $' + price;
                        statusEl.className = 'triggered';
                        document.body.classList.add('alert-flash');
                        alert('¡ALERTA! BTC alcanzó tu meta: $' + price);
                        // Sonido opcional (descomentar si se desea)
                        // new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play();
                    }
                }
            };

            ws.onerror = (err) => {
                console.error('WebSocket error:', err);
                priceEl.textContent = '⚠️ Error';
            };

            ws.onclose = () => {
                console.warn('WebSocket cerrado, reconectando en 5s...');
                setTimeout(() => location.reload(), 5000);
            };

            // --- Lógica de Alerta (botón Fijar) ---
            setBtn.addEventListener('click', () => {
                const raw = targetInput.value.trim();
                if (raw === '') {
                    statusEl.textContent = '⚠️ Ingresa un precio';
                    statusEl.className = '';
                    return;
                }
                const val = parseFloat(raw);
                if (isNaN(val) || val <= 0) {
                    statusEl.textContent = '⚠️ Número inválido';
                    statusEl.className = '';
                    return;
                }

                targetPrice = val;
                alertTriggered = false;
                statusEl.textContent = '✅ Activada en $' + val;
                statusEl.className = '';
                document.body.classList.remove('alert-flash');
                console.log('Alerta fijada en:', val);

                // Aviso si el precio actual ya supera la meta
                const currentPrice = parseFloat(priceEl.textContent.replace(/[$,]/g, ''));
                if (!isNaN(currentPrice) && currentPrice >= targetPrice) {
                    statusEl.textContent = '⚠️ El precio ya supera la meta';
                }
            });

            // Enter en el input también fija la alerta
            targetInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') setBtn.click();
            });

            // Limpieza al cerrar
            window.addEventListener('beforeunload', () => {
                if (ws.readyState === WebSocket.OPEN) ws.close();
            });

            // Inicialización
            priceEl.textContent = 'Conectando...';
            console.log('Monitor BTC 5m iniciado.');
        })();
    </script>

</body>
</html>
