<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráfico BTC 5m y Alertas</title>
    <!-- Importamos la librería Lightweight Charts desde un CDN -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111111;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #header {
            background-color: #1e1e1e;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        #ticker-info {
            display: flex;
            gap: 20px;
            align-items: baseline;
        }

        #current-price {
            font-size: 24px;
            font-weight: bold;
            color: #38bdf8;
        }

        .alert-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input {
            padding: 6px;
            background-color: #333;
            border: 1px solid #555;
            color: white;
            border-radius: 4px;
            width: 100px;
        }

        button {
            padding: 6px 12px;
            background-color: #10b981;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background-color: #059669; }

        #status {
            font-size: 12px;
            color: #94a3b8;
            margin-left: 10px;
        }

        /* Contenedor del gráfico */
        #chart-container {
            flex-grow: 1; /* Ocupa el resto de la pantalla */
            position: relative;
        }

        /* Estilo de alerta visual */
        .alert-flash {
            animation: flash 1s infinite;
        }
        @keyframes flash { 0% { background-color: rgba(244, 63, 94, 0.3); } 100% { background-color: transparent; } }

    </style>
</head>
<body>

    <div id="header">
        <div id="ticker-info">
            <h2>BTC / USDT (5m)</h2>
            <div id="current-price">Conectando...</div>
        </div>
        <div class="alert-container">
            <label for="targetPrice">Alerta Precio:</label>
            <input type="number" id="targetPrice" placeholder="Ej: 98000">
            <button onclick="fijarAlerta()">Fijar</button>
            <span id="status">Inactiva</span>
        </div>
    </div>

    <!-- Div donde se dibujará el gráfico -->
    <div id="chart-container"></div>

    <script>
        // --- Configuración del Gráfico ---
        const chartContainer = document.getElementById('chart-container');
        
        // Crear el gráfico con tema oscuro
        const chart = LightweightCharts.createChart(chartContainer, {
            layout: {
                background: { type: 'solid', color: '#111111' },
                textColor: '#d1d4dc',
            },
            grid: {
                vertLines: { color: '#2B2B43' },
                horzLines: { color: '#2B2B43' },
            },
            timeScale: {
                timeVisible: true,
                secondsVisible: false,
            },
            rightPriceScale: {
                borderColor: '#555',
            },
        });

        // Añadir la serie de velas (Candlestick Series)
        const candleSeries = chart.addCandlestickSeries({
            upColor: '#26a69a', downColor: '#ef5350',
            borderUpColor: '#26a69a', borderDownColor: '#ef5350',
            wickUpColor: '#26a69a', wickDownColor: '#ef5350',
        });

        // Ajustar el tamaño del gráfico al redimensionar la ventana
        window.addEventListener('resize', () => {
            chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });
        });
        // Forzar ajuste inicial
        chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });

        // --- Lógica de Datos y Velas 5m ---
        // Usaremos una estructura para guardar la vela actual que se está formando
        let currentBar = null;
        let lastTradePrice = 0;
        const TIMEFRAME_MINUTES = 5;

        // Función para redondear el tiempo al inicio del bloque de 5m (ej: 10:00, 10:05, etc.)
        function flattenTime(time) {
            // Multiplicar por 1000 para pasar de segundos a milisegundos JS
            const date = new Date(time * 1000);
            const minutes = date.getMinutes();
            const resto = minutes % TIMEFRAME_MINUTES;
            date.setMinutes(minutes - resto, 0, 0);
            // Volver a segundos para la librería
            return Math.floor(date.getTime() / 1000);
        }

        // --- Conexión WebSocket Binance ---
        // Usamos el stream de trades agregados para mayor eficiencia
        const ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@aggTrade');

        ws.onopen = () => {
            console.log("Conectado a Binance Aggregated Trades");
            document.getElementById('current-price').innerText = "Esperando primer tick...";
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            const price = parseFloat(data.p); // Precio del trade
            const tradeTime = data.T; // Tiempo del trade en milisegundos (importante)
            
            lastTradePrice = price;

            // Actualizar interfaz de precio superior
            const priceElement = document.getElementById('current-price');
            priceElement.innerText = "$" + price.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});

            // --- Lógica de agregación de velas 5m ---
            const eventTimeSeconds = Math.floor(tradeTime / 1000);
            const barTime = flattenTime(eventTimeSeconds);

            if (currentBar === null || barTime > currentBar.time) {
                // --- Iniciar una nueva vela ---
                // Si ya teníamos una vela anterior, la "cerramos" implícitamente al empezar una nueva
                // La librería Lightweight Charts maneja esto automáticamente si la nueva barra tiene un tiempo mayor.
                
                currentBar = {
                    time: barTime,
                    open: price,
                    high: price,
                    low: price,
                    close: price
                };
            } else {
                // --- Actualizar la vela existente ---
                currentBar.high = Math.max(currentBar.high, price);
                currentBar.low = Math.min(currentBar.low, price);
                currentBar.close = price;
            }

            // Enviar la vela actualizada al gráfico
            candleSeries.update(currentBar);

            // Verificar alerta
            verificarAlerta(price);
        };

        ws.onerror = (error) => {
            console.error("Error WebSocket:", error);
            document.getElementById('current-price').innerText = "Error de conexión";
        };

        // --- Lógica de Alertas ---
        let metaPrecio = null;
        let alertaSonada = false;

        function fijarAlerta() {
            const inputVal = document.getElementById('targetPrice').value;
            if (!inputVal) return;
            
            metaPrecio = parseFloat(inputVal);
            alertaSonada = false;
            const statusEl = document.getElementById('status');
            statusEl.innerText = "✅ $" + metaPrecio;
            statusEl.style.color = "#38bdf8";
            document.body.classList.remove('alert-flash');
            console.log("Alerta fijada en:", metaPrecio);
        }

        function verificarAlerta(precioActual) {
            if (metaPrecio !== null && !alertaSonada) {
                // Alerta si el precio cruza la meta (hacia arriba o abajo)
                if (precioActual >= metaPrecio) {
                    alertaSonada = true;
                    document.getElementById('status').innerText = "🚨 ¡ALCANZADA! $" + precioActual;
                    document.body.classList.add('alert-flash'); // Efecto visual
                    
                    alert("¡ALERTA! BTC ha alcanzado tu meta de $" + precioActual);
                    // Opcional: reproducir sonido
                    // new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play();
                }
            }
        }
    </script>
</body>
</html>
